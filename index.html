<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>NexCraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app" style="width:1280px;height:720px;">
    <header class="header">
      <h1>NexCraft</h1>
    </header>

    <main class="main">
      <div class="left">
        <div class="card auth">
          <label>Логін</label>
          <input id="username" type="text" placeholder="Введіть логін">
          <label>Пароль</label>
          <input id="password" type="password" placeholder="Введіть пароль">
        </div>

        <div class="card ram">
          <label>ОЗУ</label>
          <button id="ramBtn" class="btn">Виділити ОЗУ: <span id="ramLabel">4</span> GB</button>
        </div>

        <div class="card actions">
          <button id="playBtn" class="btn primary">Грати</button>
        </div>
      </div>

      <div class="right">
        <div class="card servers">
          <div class="card-title">Вибір сервера</div>
          <div id="serverList" class="server-list">Завантаження серверів...</div>
          <div class="server-actions">
            <button id="refreshServers" class="btn">Оновити</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="ramModal" class="modal hidden">
    <div class="modal-panel">
      <h3>Виділення ОЗУ</h3>
      <div class="ram-presets">
        <button class="ram-option" data-ram="4">4 GB</button>
        <button class="ram-option" data-ram="8">8 GB</button>
        <button class="ram-option" data-ram="12">12 GB</button>
        <button id="ramCustomBtn" class="ram-option">Власне</button>
      </div>
      <div id="customRam" class="hidden" style="margin-top: 15px;">
        <label>Введіть ГБ </label>
        <input id="customRamInput" type="number" min="1" max="32" value="4">
      </div>
      <div class="modal-actions" style="margin-top: 15px;">
        <button id="ramOk" class="btn primary">ОК</button>
        <button id="ramCancel" class="btn">Скасувати</button>
      </div>
    </div>
  </div>

  <div class="loading-screen hidden" id="loadingScreen">
    <h1 class="loading-title">NexCraft</h1>
    <p class="loading-text" id="loadingStatus">Підготовка до запуску гри...</p>
    <div class="loader-spinner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
